<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="780" fill="url(#bg)"/>
  <text x="640" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">图1　Slopsquatting 供应链攻击全景：AI 建议的每一行安装命令都是攻击面</text>

  <!-- 开发者 -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="210" height="110" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="60" y="150" width="210" height="40" rx="16" fill="#334155"/>
    <rect x="60" y="170" width="210" height="20" fill="#334155"/>
    <text x="165" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">开发者</text>
    <text x="165" y="222" text-anchor="middle" font-size="13" fill="#334155">“把 Markdown 转 PDF 装什么库？”</text>
  </g>

  <!-- 编码助手 -->
  <g filter="url(#shadow)">
    <rect x="430" y="130" width="420" height="180" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="640" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="#1e40af">AI 编码助手（LLM）</text>
    <rect x="460" y="188" width="360" height="42" rx="10" fill="url(#gBlue)"/>
    <text x="640" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">根据任务 + 参考资料生成安装建议</text>
    <rect x="460" y="246" width="360" height="42" rx="10" fill="#bfdbfe"/>
    <text x="640" y="272" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e40af">输出：pip install yaml / markdown-pdf-converter</text>
  </g>

  <!-- 包仓库 -->
  <g filter="url(#shadow)">
    <rect x="990" y="120" width="230" height="250" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="1105" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">包仓库</text>
    <rect x="1015" y="175" width="180" height="34" rx="9" fill="url(#gGreen)"/>
    <text x="1105" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">官方索引：requests 等</text>
    <rect x="1015" y="219" width="180" height="34" rx="9" fill="#fca5a5"/>
    <text x="1105" y="241" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">攻击者抢注：yaml 等</text>
    <text x="1105" y="300" text-anchor="middle" font-size="12.5" fill="#166534">同名包，含恶意 setup.py</text>
    <text x="1105" y="320" text-anchor="middle" font-size="12.5" fill="#166534">安装即执行、凭据即外带</text>
  </g>

  <!-- 恶意 setup -->
  <g filter="url(#shadow)">
    <rect x="990" y="470" width="230" height="150" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="1105" y="500" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">恶意 setup.py</text>
    <text x="1105" y="530" text-anchor="middle" font-size="12.5" fill="#7f1d1d">读取 .env / ~/.ssh</text>
    <text x="1105" y="550" text-anchor="middle" font-size="12.5" fill="#7f1d1d">把凭据外带到攻击者</text>
    <text x="1105" y="590" text-anchor="middle" font-size="12" fill="#7f1d1d">安装“成功”，中毒无感</text>
  </g>

  <!-- 数据流 -->
  <path d="M270,205 C330,205 360,210 428,210" stroke="#475569" stroke-width="3.5" fill="none" marker-end="url(#arrGray)"/>
  <text x="350" y="195" text-anchor="middle" font-size="13.5" fill="#475569">开发任务</text>

  <path d="M852,210 C900,210 940,215 988,220" stroke="#16a34a" stroke-width="3.5" fill="none" marker-end="url(#arrGreen)"/>
  <text x="920" y="200" text-anchor="middle" font-size="13" fill="#15803d">pip install</text>

  <path d="M1105,370 C1105,410 1105,440 1105,468" stroke="#dc2626" stroke-width="3.5" fill="none" marker-end="url(#arrRed)"/>
  <text x="1135" y="425" text-anchor="middle" font-size="13" fill="#dc2626">命中恶意包</text>

  <path d="M1105,620 C1105,660 1105,680 1105,700" stroke="#dc2626" stroke-width="3.5" fill="none" stroke-dasharray="8 5" marker-end="url(#arrRed)"/>
  <text x="1140" y="668" text-anchor="middle" font-size="13" fill="#dc2626">凭据外带</text>

  <!-- 攻击面标注 -->
  <rect x="250" y="420" width="620" height="150" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">三个攻击入口（都发生在“建议包名”这一步）</text>
  <text x="560" y="482" text-anchor="middle" font-size="13" fill="#78350f">① 幻觉包名：模型“编造”不存在的包（实测 yaml 等 4/8）</text>
  <text x="560" y="506" text-anchor="middle" font-size="13" fill="#78350f">② 文档投毒：README/博客推荐攻击者包，模型照抄</text>
  <text x="560" y="530" text-anchor="middle" font-size="13" fill="#78350f">③ 抢注闭环：攻击者预注册这些名字，安装即中招</text>
  <text x="560" y="558" text-anchor="middle" font-size="12" fill="#92400e">→ 全部在“pip install 那行命令”处汇聚</text>

  <text x="640" y="740" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">▲ 开发者完全信任这一行命令——它来自 AI，却可能通往攻击者的服务器</text>
</svg>
