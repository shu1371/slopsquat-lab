<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">图2　一次“装个库”如何变成凭据窃取：Slopsquatting 完整攻击链</text>

  <!-- 参与者 -->
  <g>
    <rect x="55" y="90" width="180" height="52" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="145" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">开发者</text>
    <rect x="325" y="90" width="190" height="52" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="420" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">AI 编码助手</text>
    <rect x="605" y="90" width="180" height="52" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="695" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">包仓库</text>
    <rect x="875" y="90" width="180" height="52" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="965" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">恶意 setup.py</text>
    <rect x="1095" y="90" width="150" height="52" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="1170" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">攻击者</text>
  </g>

  <line x1="145" y1="142" x2="145" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="420" y1="142" x2="420" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="695" y1="142" x2="695" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="965" y1="142" x2="965" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1170" y1="142" x2="1170" y2="660" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 步骤1 -->
  <circle cx="145" cy="200" r="14" fill="#334155"/>
  <text x="145" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <path d="M159,200 C240,200 310,200 404,200" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrGray)"/>
  <rect x="200" y="173" width="200" height="22" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="300" y="189" text-anchor="middle" font-size="12.5" fill="#334155">“从 YAML 加载配置，装什么库？”</text>

  <!-- 步骤2 -->
  <circle cx="420" cy="275" r="14" fill="#dc2626"/>
  <text x="420" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <path d="M434,275 C500,275 590,275 679,275" stroke="#dc2626" stroke-width="3.5" fill="none" marker-end="url(#arrRed)"/>
  <rect x="470" y="248" width="220" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="580" y="264" text-anchor="middle" font-size="12.5" fill="#991b1b">建议：pip install yaml（幻觉包名）</text>

  <!-- 步骤3 -->
  <circle cx="695" cy="350" r="14" fill="#16a34a"/>
  <text x="695" y="355" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <path d="M709,350 C760,350 820,350 869,350" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="720" y="323" width="170" height="22" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="805" y="339" text-anchor="middle" font-size="12.5" fill="#166534">命中攻击者抢注的 yaml</text>

  <!-- 步骤4 -->
  <circle cx="965" cy="430" r="14" fill="#dc2626"/>
  <text x="965" y="435" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <path d="M951,430 C880,430 820,430 711,430" stroke="#dc2626" stroke-width="3.5" fill="none" marker-end="url(#arrRed)"/>
  <rect x="740" y="403" width="200" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="840" y="419" text-anchor="middle" font-size="12.5" fill="#991b1b">恶意 setup.py 随安装执行</text>

  <!-- 步骤5 -->
  <circle cx="965" cy="510" r="14" fill="#dc2626"/>
  <text x="965" y="515" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <path d="M979,510 C1060,510 1120,510 1154,510" stroke="#dc2626" stroke-width="3.5" fill="none" stroke-dasharray="8 5" marker-end="url(#arrRed)"/>
  <rect x="1015" y="483" width="160" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="1095" y="499" text-anchor="middle" font-size="12.5" fill="#991b1b">.env 凭据外带</text>

  <text x="640" y="660" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">▲ 开发者只做了一件事：复制粘贴 AI 给的安装命令</text>
</svg>
